services:
  postgres:
    image: postgres:16-alpine
    container_name: messenger_db
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-messenger_db}',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: messenger_redis
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  backend:
    build:
      context: ./backend
    container_name: messenger_backend
    restart: unless-stopped
    # Единый корневой .env — DB_* и COOKIE_* приходят как переменные окружения,
    # pydantic-settings читает их из OS env (файл в образ не попадает).
    env_file:
      - ./.env
    environment:
      # Только то, что специфично для compose-сети (переопределяет .env)
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # uploads — изолированный volume, чтобы пережить пересоздание контейнера
      - uploads_data:/app/uploads
      # RSA-ключи не попадают в образ (.dockerignore) — монтируются только в рантайме
      - ./backend/keys:/app/keys:ro
    ports:
      - '8000:8000'
    networks:
      - internal

volumes:
  pg_data:
  uploads_data:

networks:
  internal:
    driver: bridge
