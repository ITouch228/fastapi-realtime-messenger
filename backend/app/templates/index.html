<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITMessage</title>
    <audio id="NotifySound" src="/static/sounds/notify.mp3"></audio>
    <link rel="icon" href="/static/images/favicon.ico" type="image/x-icon" />
    <link href="/static/css/index.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>
  <body>
    <div class="sidebar">
      <div class="user-info">
        <div class="user-avatar"></div>
        <div class="user-name"></div>
        <button class="logout-btn">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M10 22H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h5M17 16l4-4-4-4M21 12H9"
            />
          </svg>
        </button>
      </div>

      <div class="search-container">
        <input
          type="text"
          class="search-input"
          id="searchInput"
          placeholder="Поиск пользователей..."
        />
        <div class="search-results" id="searchResults"></div>
      </div>

      <div class="chat-list"></div>
    </div>

    <div class="chat-area">
      <div class="messages" id="messages"></div>

      <div class="input-area">
        <div class="file-input-wrapper">
          <div class="file-input-button">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M11 14.9861C11 15.5384 11.4477 15.9861 12 15.9861C12.5523 15.9861 13 15.5384 13 14.9861V7.82831L16.2426 11.0709L17.6568 9.65669L12 4L6.34314 9.65669L7.75735 11.0709L11 7.82831V14.9861Z"
                fill="currentColor"
              />
              <path
                d="M4 14H6V18H18V14H20V18C20 19.1046 19.1046 20 18 20H6C4.89543 20 4 19.1046 4 18V14Z"
                fill="currentColor"
              />
            </svg>
          </div>
          <input type="file" id="fileInput" class="file-input" name="file" />
        </div>
        <input
          type="text"
          class="message-input"
          id="messageInput"
          placeholder="Напишите сообщение..."
        />
        <button class="send-btn" id="sendBtn">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M22 2L11 13"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M22 2L15 22L11 13L2 9L22 2Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
    </div>

    <script type="module" src="/static/js/state.js"></script>
    <script type="module" src="/static/js/auth.js"></script>
    <script type="module" src="/static/js/messages.js"></script>
    <script type="module" src="/static/js/messageHandler.js"></script>
    <script type="module" src="/static/js/utils.js"></script>
    <script type="module" src="/static/js/main.js"></script>
  </body>
</html>
