<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Форма регистрации</title>
    <link href="/static/css/register.css" rel="stylesheet" />
    <link href="/static/css/badge.css" rel="stylesheet" />
  </head>
  <body>
    <div class="pet-badge">
      <span class="pet-badge__icon">🧪</span>
      <span class="pet-badge__text">
        <strong>Pet-проект</strong> — только для тестирования функционала.<br />
        Не вводите личные и конфиденциальные данные.
      </span>
      <button class="pet-badge__close" type="button" aria-label="Закрыть">✕</button>
    </div>

    <div class="container">
      <div class="form-container register-container">
        <h2>Регистрация</h2>
        <h4 id="message"></h4>
        <form id="registerForm">
          <div class="form-group">
            <label for="register-username">Логин</label>
            <input
              type="text"
              id="register-username"
              name="username"
              required
            />
          </div>
          <div class="form-group">
            <label for="register-email">Email</label>
            <input type="email" id="register-email" name="email" required />
          </div>
          <div class="form-group">
            <label for="register-password">Пароль</label>
            <input
              type="password"
              id="register-password"
              name="password"
              required
            />
          </div>
          <button type="submit">Зарегистрироваться</button>
          <a style="text-decoration: none; color: grey" href="./login"
            ><h4>Уже есть аккаунт? Войти</h4></a
          >
        </form>
      </div>
    </div>

    <script type="module" src="/static/js/features/register.js"></script>
    <script type="module" src="/static/js/ui/badge.js"></script>
  </body>
</html>
