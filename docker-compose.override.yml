# DEV overlay. Подхватывается автоматически командой `docker compose up`.
# Для продакшена запускать явно:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  backend:
    environment:
      # включает --reload в entrypoint.sh
      UVICORN_RELOAD: "1"
    volumes:
      # bind-mount кода: правка файлов на хосте сразу видна в контейнере,
      # --reload перезапускает процесс. Не для продакшена.
      - ./backend:/app
    ports:
      - '8002:8000'

  gateway:
    image: nginx:stable-alpine
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    volumes:
      - ./dev-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '8001:8001'
      - '8003:8003'
    networks:
      - internal
