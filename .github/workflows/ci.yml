name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python 3.12 / lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: messenger_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: messenger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U messenger_test -d messenger_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Ruff formatting diagnostic for auth tests
        working-directory: backend
        run: ruff format --diff tests/test_auth_sessions.py || true

      - name: Ruff formatting
        working-directory: backend
        run: ruff format --check .

      - name: Mypy
        working-directory: backend
        run: mypy --package app

      - name: Unit tests with branch coverage
        working-directory: backend
        # Redis integration suite is intentionally skipped unless its flag is enabled.
        run: |
          coverage run --branch --source=app -m unittest discover -s tests -p 'test_*.py' -v
          coverage report --fail-under=45 --show-missing
          coverage xml -o coverage.xml

      - name: Publish backend unit coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-coverage
          path: backend/coverage.xml
          if-no-files-found: error

      - name: PostgreSQL migration smoke test (fresh database)
        working-directory: backend
        env:
          DB_USER: messenger_test
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: messenger_test
        run: |
          # Только пустая одноразовая БД CI: проверяем единственную базовую
          # ревизию, соответствие моделям и повторное создание после downgrade.
          alembic heads
          alembic upgrade head
          alembic current
          alembic check
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Redis multiworker integration tests
        working-directory: backend
        env:
          REDIS_INTEGRATION_TESTS: '1'
          REDIS_INTEGRATION_URL: redis://localhost:6379/15
        run: python -m unittest discover -s tests -p 'test_integration_*.py' -v

      - name: FastAPI HTTP smoke (PostgreSQL, Redis, RSA)
        working-directory: backend
        env:
          DB_USER: messenger_test
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: messenger_test
          REDIS_URL: redis://localhost:6379/14
          COOKIE_SECURE: 'false'
        run: |
          mkdir -p keys
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out keys/private.pem
          openssl pkey -in keys/private.pem -pubout -out keys/public.pem
          uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/itmessage-smoke.log 2>&1 &
          server_pid=$!
          trap 'cat /tmp/itmessage-smoke.log; kill "$server_pid" 2>/dev/null || true' EXIT
          python tests/smoke_http.py
          python tests/contracts_http.py

  frontend:
    name: Node 22 / ESLint, Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked project dependencies
        run: npm ci

      - name: Frontend presence ordering tests
        run: node --test tests/presence-version.test.mjs

      # ESLint/Prettier were previously invoked through unpinned npx.
      # Pin CLI versions explicitly until they're declared in package.json/lockfile.
      - name: ESLint
        run: npx --yes --package eslint@9.39.2 eslint backend/app/static/js

      - name: Prettier
        run: npx --yes --package prettier@3.6.2 prettier --check "backend/app/static/**/*.{js,css,html}"

  docker_compose:
    name: Docker / 4 Uvicorn workers / HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare isolated test secrets
        run: |
          cp .env.example .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=ci-only-strong-password/' .env
          sed -i 's/^COOKIE_SECURE=.*/COOKIE_SECURE=false/' .env
          mkdir -p backend/keys
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out backend/keys/private.pem
          openssl pkey -in backend/keys/private.pem -pubout -out backend/keys/public.pem
          # Ephemeral CI key: readable inside container by UID 10001.
          chmod 755 backend/keys
          chmod 644 backend/keys/private.pem backend/keys/public.pem

      - name: Validate production Compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Build and boot application with real Compose
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait --wait-timeout 180

      - name: Verify 4 Uvicorn child workers and RSA key mounts
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T backend python - <<'PY'
          import os
          from pathlib import Path

          assert os.environ.get('UVICORN_WORKERS') == '4'
          for name in ('private.pem', 'public.pem'):
              path = Path('/app/keys') / name
              assert path.is_file() and os.access(path, os.R_OK), name

          # Entrypoint execs Uvicorn master as PID 1. Uvicorn multiprocess
          # workers are immediate children of PID 1.
          children = []
          for proc in Path('/proc').iterdir():
              if not proc.name.isdigit():
                  continue
              try:
                  info = (proc / 'status').read_text()
                  if any(line.strip() == 'PPid:\t1' for line in info.splitlines()):
                      children.append(int(proc.name))
              except (FileNotFoundError, PermissionError, ProcessLookupError):
                  continue
          assert len(children) >= 4, f'Expected 4 Uvicorn workers: {children}'
          print('4 Uvicorn workers and runtime RSA keys OK:', children)
          PY

      - name: Ensure Docker image contains no embedded secrets
        run: |
          image_id=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml images -q backend)
          test -n "$image_id"
          docker run --rm --entrypoint sh "$image_id" -c 'test ! -e /app/keys/private.pem && test ! -e /app/keys/public.pem && test ! -e /app/.env'

      - name: HTTP smoke test through Docker port 8000
        run: python3 backend/tests/smoke_http.py

      - name: Check restart with persistent database
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml restart backend
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --wait --wait-timeout 120
          python3 backend/tests/smoke_http.py

      - name: Service logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --no-color --tail=250

      - name: Clean up
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down --volumes --remove-orphans
